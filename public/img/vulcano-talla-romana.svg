<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bajorrelieve romano de la forja">
  <!--
    Talla romana para los laterales del escenario VULCANO.
    Se usa como máscara sobre textura de piedra: solo importa la FORMA,
    no el color (el color lo pone el CSS con mix-blend-mode).
    Mosaico de motivos: roleo, yunque, martillo, llama, yunques en fila.
  -->
  <g fill="#fff" stroke="none">

    <!-- ===== Faja 1: greca (meandro romano) ===== -->
    <path d="M12 20 H228 V34 H26 V58 H214 V72 H26 V96 H214 V110 H40 V124 H200 V138 H40 V162 H200 V176 H12 V162 H186 V138 H54 V124 H186 V110 H12 V96 H186 V72 H54 V58 H186 V44 H12 Z" opacity=".85"/>

    <!-- ===== Faja 2: roleo de acanto ===== -->
    <path d="M120 196
             C 150 196 170 214 170 236
             C 170 258 150 274 124 274
             C 104 274  90 262  90 246
             C  90 232 102 222 114 222
             C 124 222 132 228 132 236
             C 132 242 128 246 122 246
             C 118 246 116 244 116 241
             L 121 241
             C 122 236 118 231 112 231
             C 105 231 100 238 100 247
             C 100 259 110 266 122 266
             C 141 266 160 253 160 236
             C 160 219 145 205 122 205
             L 120 205 Z"/>
    <path d="M120 196 C 90 196 70 214 70 236 C 70 258 90 274 116 274 C 136 274 150 262 150 246 C 150 232 138 222 126 222 C 116 222 108 228 108 236 C 108 242 112 246 118 246 C 122 246 124 244 124 241 L 119 241 C 118 236 122 231 128 231 C 135 231 140 238 140 247 C 140 259 130 266 118 266 C 99 266 80 253 80 236 C 80 219 95 205 118 205 L 120 205 Z"/>

    <!-- ===== Faja 3: yunque tallado ===== -->
    <g transform="translate(60 300) scale(.62)">
      <path d="M 0 40 C 70 28 140 22 240 22 C 240 22 240 22 240 22
               L 240 54 L 170 62 L 162 78 L 0 78 Z"/>
      <path d="M 170 62 L 200 62 L 200 78 L 162 78 Z"/>
      <rect x="30" y="78" width="180" height="26" rx="2"/>
      <rect x="88" y="104" width="64" height="46"/>
      <path d="M 60 150 L 180 150 L 200 178 L 40 178 Z"/>
    </g>

    <!-- ===== Faja 4: martillo y cincel cruzados ===== -->
    <g transform="translate(120 400) rotate(-32)">
      <rect x="-6" y="-70" width="12" height="140" rx="4"/>
      <rect x="-34" y="-84" width="68" height="26" rx="5"/>
    </g>
    <g transform="translate(120 400) rotate(32)">
      <rect x="-5" y="-70" width="10" height="140" rx="3"/>
      <path d="M -10 -70 L 10 -70 L 5 -92 L -5 -92 Z"/>
    </g>

    <!-- ===== Faja 5: llama de la forja ===== -->
    <g transform="translate(120 490)">
      <path d="M 0 -60
               C 26 -18  42 -2  36 24
               C 58 8  66 -14 58 -34
               C 88 -4  96 34  80 62
               C 64 88  32 100  0 100
               C -32 100 -64 88 -80 62
               C -96 34 -88 -4 -58 -34
               C -66 -14 -58 8 -36 24
               C -42 -2 -26 -18 0 -60 Z"/>
    </g>

    <!-- ===== Faja 6: greca invertida ===== -->
    <path d="M12 640 H228 V654 H26 V678 H200 V692 H54 V706 H186 V720 H12 V706 H162 V692 H68 V678 H186 V664 H12 Z" opacity=".85"/>
  </g>
</svg>
